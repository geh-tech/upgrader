<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎰 CS:GO Апгрейдер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ===== ЛЕНТА ОНЛАЙН-АПГРЕЙДОВ ===== -->
<div id="historyBar">
  <div class="history-container">
    <span class="history-label">🔥 Онлайн апгрейды:</span>
    <div id="historyList" class="history-list">
      <span class="history-placeholder">Загрузка...</span>
    </div>
  </div>
</div>

<!-- ===== ОСНОВНОЙ КОНТЕЙНЕР ===== -->
<div class="container">
  <h1>🎰 Апгрейдер CS:GO</h1>
  <div class="subtitle">Поставь скин – рискуй – улучшай или теряй</div>

  <!-- Авторизация -->
  <div id="authSection" class="auth-section">
    <input type="text" id="loginUsername" placeholder="Логин" />
    <input type="password" id="loginPassword" placeholder="Пароль" />
    <button onclick="login()">Вход</button>
    <button onclick="register()">Регистрация</button>
  </div>

  <!-- Информация о пользователе -->
  <div id="userInfo" class="user-info" style="display:none;">
    Привет, <span id="usernameDisplay"></span>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>

  <!-- Добавление предмета (для теста) -->
  <div id="addItemSection" style="display:none;">
    <div class="add-item">
      <input type="text" id="itemName" placeholder="Название предмета" />
      <input type="number" id="itemPrice" placeholder="Цена" value="100" />
      <button onclick="addItem()">➕ Добавить</button>
    </div>
  </div>

  <!-- ИНВЕНТАРЬ (СЕТКА) -->
  <div id="inventoryContainer">
    <div class="empty-msg">Загружаем инвентарь...</div>
  </div>

  <div id="message" class="error-msg"></div>
</div>

<!-- ===== МОДАЛЬНОЕ ОКНО АПГРЕЙДА ===== -->
<div id="upgradeModal" class="modal">
  <div class="modal-content">
    <h2>⚡ Апгрейд</h2>
    <p id="modalItemName" style="font-size:1.2rem; margin-bottom:5px;"></p>
    <p style="color:#aaa;">Текущий уровень: <span id="modalCurrentLevel"></span></p>
    <p style="color:#aaa;">Цена: <span id="modalPrice"></span></p>

    <!-- Canvas для круга -->
    <canvas id="wheelCanvas" width="250" height="250"></canvas>

    <!-- Ползунок шанса -->
    <div style="margin: 15px 0;">
      <label for="chanceSlider">Шанс: <span id="chanceDisplay">50</span>%</label>
      <input type="range" id="chanceSlider" min="1" max="99" value="50" step="1" style="width:100%;" />
    </div>

    <!-- Отображение коэффициента и скрытого шанса -->
    <div style="font-size:0.95rem; color:#aaa;">
      Коэффициент: <span id="coefficientDisplay">1.95</span>x<br />
      Скрытый шанс: <span id="hiddenChanceDisplay">50.0</span>%
    </div>

    <div id="modalResult" class="result"></div>
    <button onclick="confirmUpgrade()" id="upgradeBtn" class="upgrade-btn">КРУТИТЬ!</button>
    <br />
    <button class="close-btn" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script src="client.js"></script>
</body>
</html>
