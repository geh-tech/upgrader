<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎰 CS:GO Апгрейдер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
  <h1>🎰 Апгрейдер CS:GO</h1>
  <div class="subtitle">Ставь скин – рискуй – улучшай или теряй</div>

  <!-- Лента онлайн-апгрейдов -->
  <div id="upgradeFeed" class="upgrade-feed">
    <h3>⚡ Последние апгрейды</h3>
    <ul id="feedList">
      <li>Загрузка...</li>
    </ul>
  </div>

  <!-- Блок авторизации -->
  <div id="authSection" class="auth-section">
    <input type="text" id="loginUsername" placeholder="Логин" />
    <input type="password" id="loginPassword" placeholder="Пароль" />
    <button onclick="login()">Вход</button>
    <button onclick="register()">Регистрация</button>
  </div>

  <!-- Информация о пользователе -->
  <div id="userInfo" class="user-info" style="display:none;">
    Привет, <span id="usernameDisplay"></span> | Баланс: <span id="balanceDisplay">0</span> 🪙
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>

  <!-- Генерация случайного предмета -->
  <div id="addItemSection" style="display:none;">
    <div class="add-item">
      <button onclick="generateAndAddItem()">🎲 Получить случайный предмет</button>
    </div>
  </div>

  <!-- Инвентарь в виде сетки -->
  <div id="inventoryContainer">
    <div class="empty-msg">Загружаем инвентарь...</div>
  </div>

  <div id="message" class="error-msg"></div>
</div>

<!-- Модальное окно апгрейда -->
<div id="upgradeModal" class="modal">
  <div class="modal-content">
    <h2>⚡ Апгрейд</h2>
    <p id="modalItemName" style="font-size:1.2rem;"></p>
    <p style="color:#aaa;">Уровень: <span id="modalCurrentLevel"></span> | Цена: <span id="modalItemPrice"></span> 🪙</p>

    <canvas id="wheelCanvas" width="250" height="250"></canvas>

    <div style="margin: 15px 0;">
      <label for="chanceSlider">Шанс: <span id="chanceDisplay">50</span>%</label>
      <input type="range" id="chanceSlider" min="1" max="99" value="50" step="1" style="width:100%;" />
    </div>

    <div style="font-size:0.95rem; color:#aaa;">
      Коэффициент: <span id="coefficientDisplay">1.95</span>x
    </div>
    <div style="font-size:0.9rem; color:#888; margin-top:5px;">
      (Скрытый шанс с учётом цены: <span id="hiddenChanceDisplay">50</span>%)
    </div>

    <div id="modalResult" class="result"></div>
    <button onclick="confirmUpgrade()" id="upgradeBtn" class="upgrade-btn">КРУТИТЬ!</button>
    <br />
    <button class="close-btn" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script src="client.js"></script>
</body>
</html>
