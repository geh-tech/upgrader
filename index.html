<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎰 CS:GO Апгрейдер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
  <h1>🎰 Апгрейдер CS:GO</h1>
  <div class="subtitle">Поставь скин – рискуй – улучшай или теряй</div>

  <!-- Блок авторизации -->
  <div id="authSection" class="auth-section">
    <input type="text" id="loginUsername" placeholder="Логин" />
    <input type="password" id="loginPassword" placeholder="Пароль" />
    <button onclick="login()">Вход</button>
    <button onclick="register()">Регистрация</button>
  </div>

  <!-- Информация о пользователе -->
  <div id="userInfo" class="user-info" style="display:none;">
    Привет, <span id="usernameDisplay"></span>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>

  <!-- Добавление предмета -->
  <div id="addItemSection" style="display:none;">
    <div class="add-item">
      <input type="text" id="itemName" placeholder="Название предмета" />
      <input type="number" id="itemLevel" placeholder="Уровень (число)" min="1" value="1" />
      <button onclick="addItem()">➕ Добавить</button>
    </div>
  </div>

  <!-- Инвентарь -->
  <div id="inventoryContainer">
    <div class="empty-msg">Загружаем инвентарь...</div>
  </div>

  <div id="message" class="error-msg"></div>
</div>

<!-- Модальное окно апгрейда -->
<div id="upgradeModal" class="modal">
  <div class="modal-content">
    <h2>⚡ Апгрейд</h2>
    <p id="modalItemName" style="font-size:1.2rem; margin-bottom:5px;"></p>
    <p style="color:#aaa;">Текущий уровень: <span id="modalCurrentLevel"></span></p>
    <p style="margin:15px 0 5px;">Выбери шанс:</p>
    <div class="chance-buttons">
      <button onclick="selectChance(50)">50%</button>
      <button onclick="selectChance(30)">30%</button>
      <button onclick="selectChance(10)">10%</button>
    </div>
    <div id="chanceInfo" style="font-size:0.9rem; color:#aaa;">При успехе: +1 уровень</div>
    <div id="modalResult" class="result"></div>
    <button onclick="confirmUpgrade()" id="upgradeBtn" class="upgrade-btn">КРУТИТЬ!</button>
    <br />
    <button class="close-btn" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script src="client.js"></script>
</body>
</html>
