<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎲 Dice of Kalma</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
  <h1>🎲 Dice of Kalma</h1>
  <div class="subtitle">Собери комбинацию, побей лимит</div>

  <!-- Авторизация -->
  <div id="authSection" class="auth-section">
    <input type="text" id="loginUsername" placeholder="Логин" />
    <input type="password" id="loginPassword" placeholder="Пароль" />
    <button onclick="login()">Вход</button>
    <button onclick="register()">Регистрация</button>
  </div>

  <!-- Игровой интерфейс -->
  <div id="gameSection" style="display:none;">
    <div class="user-info">
      Привет, <span id="usernameDisplay"></span>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <!-- Статус -->
    <div class="status-bar">
      <div class="status-item">Уровень <span id="levelDisplay">1</span></div>
      <div class="status-item">Лимит <span id="limitDisplay">100</span></div>
      <div class="status-item">Кость <span id="boneDisplay">0</span></div>
      <div class="status-item">Множ <span id="multiplierDisplay">0</span>x</div>
      <div class="status-item">Итог <span id="totalDisplay">0</span></div>
    </div>

    <!-- Кубики -->
    <div class="dice-container" id="diceContainer">
      <div class="dice" data-index="0">⚀</div>
      <div class="dice" data-index="1">⚀</div>
      <div class="dice" data-index="2">⚀</div>
      <div class="dice" data-index="3">⚀</div>
      <div class="dice" data-index="4">⚀</div>
    </div>

    <!-- Информация о перебросах и руках -->
    <div class="info-row">
      <span>Перебросов: <strong id="rerollCount">3</strong></span>
      <span>Рук: <strong id="handCount">3</strong></span>
    </div>

    <!-- Кнопки -->
    <div class="actions">
      <button onclick="rerollSelected()" id="rerollBtn" disabled>🔄 Переброс</button>
      <button onclick="playHand()" id="playBtn" disabled>🎯 Играть руку</button>
    </div>

    <!-- Результат -->
    <div id="resultMessage" class="result"></div>

    <!-- Инвентарь -->
    <div class="inventory-section">
      <h3>📦 Инвентарь</h3>
      <div id="inventoryContainer" class="inventory-grid"></div>
    </div>
  </div>

  <div id="message" class="error-msg"></div>
</div>

<script src="client.js"></script>
</body>
</html>
