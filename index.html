<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎲 Dice of Kalma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎲 Dice of Kalma</h1>
    <p class="subtitle">Брось кубики, собери комбинацию, победи лимит</p>
  </div>

  <!-- Авторизация -->
  <div id="authSection" class="auth-section">
    <input type="text" id="loginUsername" placeholder="Логин" />
    <input type="password" id="loginPassword" placeholder="Пароль" />
    <button onclick="login()">Вход</button>
    <button onclick="register()">Регистрация</button>
  </div>

  <!-- Игровой интерфейс -->
  <div id="gameSection" style="display:none;">
    <div class="user-info">
      <span>Привет, <span id="usernameDisplay"></span></span>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <!-- Статус бар -->
    <div class="status-bar">
      <div class="status-item">
        <span class="label">Уровень</span>
        <span class="value" id="levelDisplay">1</span>
      </div>
      <div class="status-item">
        <span class="label">Лимит</span>
        <span class="value" id="limitDisplay">25</span>
      </div>
      <div class="status-item">
        <span class="label">Кость</span>
        <span class="value" id="boneDisplay">0</span>
      </div>
      <div class="status-item">
        <span class="label">Множ</span>
        <span class="value" id="multiplierDisplay">0</span>
      </div>
      <div class="status-item">
        <span class="label">Итог</span>
        <span class="value" id="totalDisplay">0</span>
      </div>
    </div>

    <!-- Кубики -->
    <div class="dice-container" id="diceContainer">
      <div class="dice" data-index="0">⚀</div>
      <div class="dice" data-index="1">⚁</div>
      <div class="dice" data-index="2">⚂</div>
      <div class="dice" data-index="3">⚃</div>
      <div class="dice" data-index="4">⚄</div>
    </div>

    <!-- Информация о перебросах и руках -->
    <div class="info-row">
      <span>🔄 Перебросов: <strong id="rerollCount">3</strong></span>
      <span>🎯 Рук: <strong id="handCount">3</strong></span>
    </div>

    <!-- Кнопки -->
    <div class="actions">
      <button onclick="rerollSelected()" id="rerollBtn" disabled>🔄 Переброс</button>
      <button onclick="playHand()" id="playBtn" disabled>🎯 Играть руку</button>
    </div>

    <!-- Результат -->
    <div id="resultMessage" class="result"></div>

    <!-- Инвентарь -->
    <div class="inventory-section">
      <h3>📦 Инвентарь</h3>
      <div id="inventoryContainer" class="inventory-grid"></div>
    </div>
  </div>

  <div id="message" class="error-msg"></div>
</div>

<script src="client.js"></script>
</body>
</html>
